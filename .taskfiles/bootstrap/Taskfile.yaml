---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      - '[ -f secrets.yaml ] || topf secrets | sops encrypt --filename-override talos/secrets.yaml /dev/stdin > secrets.yaml'
      - topf apply --auto-bootstrap
      - topf talosconfig > {{.TALOSCONFIG}}
      - until topf kubeconfig > {{.ROOT_DIR}}/kubeconfig; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TOPFCONFIG}}
      - which topf sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmds:
      - bash {{.KUBERNETES_DIR}}/bootstrap/apps/resources/prepare.sh
      - helmfile --file {{.KUBERNETES_DIR}}/bootstrap/apps/helmfile.yaml apply --skip-diff-on-install --suppress-diff
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.KUBERNETES_DIR}}/bootstrap/apps/helmfile.yaml
      - test -f {{.KUBERNETES_DIR}}/bootstrap/apps/resources/prepare.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which helmfile
