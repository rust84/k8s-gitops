---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  render:
    desc: Render Talos machine configs to ./output (contains secrets, gitignored)
    dir: '{{.TALOS_DIR}}'
    cmd: topf render --online
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  diff:
    desc: Show the config diff against running nodes without applying [NODE=optional hostname]
    dir: '{{.TALOS_DIR}}'
    cmd: topf --nodes-filter '^{{.NODE}}$' apply --dry-run || [ $? -eq 2 ] # exit 2 = changes detected
    vars:
      NODE: '{{.NODE | default ".*"}}'
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply:
    desc: Apply Talos config [NODE=optional hostname] [MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf --nodes-filter '^{{.NODE}}$' apply --mode={{.MODE}}
    vars:
      NODE: '{{.NODE | default ".*"}}'
      MODE: '{{.MODE | default "auto"}}'
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade:
    desc: Upgrade Talos to topf.yaml talosVersion [NODE=optional hostname]
    dir: '{{.TALOS_DIR}}'
    cmd: topf --nodes-filter '^{{.NODE}}$' upgrade
    vars:
      NODE: '{{.NODE | default ".*"}}'
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade-k8s:
    desc: Upgrade Kubernetes to topf.yaml kubernetesVersion
    cmd: talosctl --nodes {{.CONTROLLER}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      CONTROLLER:
        sh: yq '[.nodes[] | select(.role == "control-plane")] | .[0].ip' {{.TOPFCONFIG}}
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TOPFCONFIG}}
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  talosconfig:
    desc: Generate talosconfig from the secrets bundle
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig > {{.TALOSCONFIG}}
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  reset:
    desc: Resets nodes back to maintenance mode [NODE=optional hostname]
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf --nodes-filter '^{{.NODE}}$' reset --graceful=false {{- if eq .CLI_FORCE false }} --full=false{{ end }}
    vars:
      NODE: '{{.NODE | default ".*"}}'
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - which topf
