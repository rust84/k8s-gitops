---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-secret
  namespace: ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        MEMINI_LLM_API_KEY: "{{ .LITELLM_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
