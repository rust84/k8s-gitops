---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
  namespace: ai
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: memini
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          main:
            env:
              TZ: ${TZ}
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: sqlite
              MEMINI_DEBUG: "true"
              MEMINI_DEFAULT_NAMESPACE: ai
              MEMINI_LOG_FORMAT: json
              MEMINI_LOG_LEVEL: debug
              # in-cluster TEI embeddings server (bge-small-en-v1.5, 384-dim)
              MEMINI_EMBED_BASE_URL: http://text-embeddings.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: bge-small-en-v1.5
              MEMINI_EMBED_DIMS: "384"
              # Opt-in LLM pipeline: dedup/consolidation, episodic->semantic
              # promotion, /v1/answer, and rerank. Routed through litellm
              # (ai namespace) to a hosted OpenAI-compatible provider.
              MEMINI_LLM_API: openai
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: gpt-6-luna
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_LLM_API_KEY
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    persistence:
      data:
        existingClaim: *app
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      ui:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    serviceMonitor:
      main:
        enabled: true
