---
use_default_settings: true

general:
  contact_url: false
  debug: false
  donation_url: false
  enable_metrics: true
  instance_name: Search
  privacypolicy_url: false

ui:
  center_alignment: true
  default_theme: simple
  hotkeys: vim
  url_formatting: pretty
  infinite_scroll: true
  query_in_title: true
  static_use_hash: true
  theme_args:
    simple_style: dark

search:
  # Autocomplete and favicon resolvers were set to duckduckgo, which fires one
  # upstream request per keystroke and per result row. For a private instance
  # driven by automated agents (open-webui RAG, openclaw) these
  # generate zero value and were the dominant source of DDG captcha/rate-limits.
  # Disabling them cuts most wasted upstream calls. Set back to "duckduckgo" if
  # interactive UI usage on search.jory.dev wants them back.
  autocomplete: ""
  favicon_resolver: ""
  languages:
    - all
    - en
    - en-US
  formats:
    - html
    - json

server:
  # base_url, port, secret_key set via env vars
  image_proxy: true
  limiter: true
  method: GET # https://github.com/searxng/searxng/pull/3619
  public_instance: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: "noindex, nofollow"
    Referrer-Policy: no-referrer

outgoing:
  request_timeout: 3.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Tor check plugin
  - Open Access DOI rewrite
  - Hostnames plugin
  - Unit converter plugin
  - Tracker URL remover

doi_resolvers:
  sci-hub.se: "https://sci-hub.se/"

default_doi_resolver: sci-hub.se

# Engines disabled because they were rate-limiting / captcha-ing this instance's
# single egress IP. Merged by `name` against use_default_settings. If an engine
# stops failing after traffic drops, it can be re-enabled here.
engines:
  - name: startpage
    disabled: true
  - name: karmasearch
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: duckduckgo web
    disabled: false
  - name: brave
    disabled: true
  - name: braveapi
    disabled: false
    inactive: false
    api_key: ${BRAVE_API_KEY}

hostnames:
  high_priority:
    - (.*)\/blog\/(.*)
    - (.*\.)?wikipedia.org$
    - (.*\.)?github.com$
    - (.*\.)?reddit.com$
    - (.*\.)?docker.com$
    - (.*\.)?archlinux.org$
    - (.*\.)?stackoverflow.com$
    - (.*\.)?askubuntu.com$
    - (.*\.)?superuser.com$
