---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paseo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      paseo:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/paseo
              tag: 0.15.0@sha256:315deb7172996d63c717f5ab6d5db467aa7de95eed16fdd636b5a07792d94031
            env:
              TZ: ${TZ}
              PASEO_LISTEN: 0.0.0.0:6767
              PASEO_HOSTNAMES: "paseo.${SECRET_DOMAIN}"
              PASEO_TRUSTED_PROXIES: 10.42.0.0/16
              PASEO_WEB_UI_ENABLED: "true"
              PASEO_RELAY_ENABLED: "false"
              PASEO_LOG_FILE_LEVEL: info
              GIT_CONFIG_GLOBAL: /etc/paseo/.gitconfig
            envFrom:
              - secretRef:
                  name: paseo-secret
            ports:
              - name: http
                containerPort: 6767
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 6767
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 6767
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 6767
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile: { type: RuntimeDefault }
    service:
      paseo:
        controller: paseo
        ports:
          http:
            port: 6767
    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-robot
          gethomepage.dev/name: Paseo
          gethomepage.dev/description: AI coding-agent orchestration daemon
        hostnames:
          - "paseo.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          paseo:
            app:
              - path: /home/paseo
                subPath: home
              - path: /workspace
                subPath: workspace
      config:
        type: projected
        sources:
          - configMap:
              name: paseo-config
              items:
                - key: paseo.json
                  path: paseo.json
          - configMap:
              name: opencode-config
              items:
                - key: opencode.json
                  path: opencode.json
        advancedMounts:
          paseo:
            app:
              - path: /etc/paseo
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
