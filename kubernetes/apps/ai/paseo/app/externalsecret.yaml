---
# NOT YET ENABLED — deliberately NOT referenced in ./kustomization.yaml.
#
# The 1Password item `paseo` does not exist in the vault yet and cannot be created from here
# (the Connect token is read-only: 403 on create). Until the item exists, applying this would
# put SecretSyncedError in the cluster. Secret/paseo-secret (key PASEO_PASSWORD) was therefore
# created directly in-cluster, and the HelmRelease consumes it via secretKeyRef.
#
# To switch this on later: create the 1Password item `paseo` with field PASEO_PASSWORD, verify
# the Connect API can read it, add `- ./externalsecret.yaml` to ./kustomization.yaml, and adopt
# the existing Secret (set an ownerReference or recreate) so creationPolicy: Owner can take over.
#
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/externalsecrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo-secret
  namespace: ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        PASEO_PASSWORD: "{{ .PASEO_PASSWORD }}"
  dataFrom:
    - extract:
        key: paseo
