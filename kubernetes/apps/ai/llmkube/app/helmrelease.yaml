---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app llmkube
  namespace: ai
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: llmkube
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    namespace: ai
    crds:
      install: true
      keep: true
    controllerManager:
      replicaCount: 1
      leaderElection:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    metrics:
      enabled: false
    prometheus:
      serviceMonitor:
        enabled: false
        interval: 30s
      inferencePodMonitor:
        enabled: false
        interval: 30s
      prometheusRule:
        enabled: false
    # perService keeps each InferenceService on its own node's iGPU (the cluster
    # advertises gpu.intel.com/i915 on every node). openebs-hostpath is a
    # WaitForFirstConsumer local provisioner, so the per-service cache binds to
    # the node the GPU pod actually lands on -- model weights stay local to that
    # node's iGPU. Shared mode would pin every service to a single node.
    modelCache:
      enabled: true
      mode: perService
      size: 10Gi
      storageClass: openebs-hostpath
      accessMode: ReadWriteOnce
      mountPath: /models
