---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubectl
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount: kubectl-mcp-readonly
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
          env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
            - name: MCP_ALLOWED_HOSTS
              value: "*"
            - name: MCP_ALLOWED_ORIGINS
              value: "*"
          # The operator's default security profile runs the container as UID 1000,
          # but this image's WORKDIR (/home/mcp) is mode 700 owned by UID 10001.
          # pydantic-settings walks the CWD looking for .env and crashes with
          # PermissionError when the CWD itself is not traversable. Run as the
          # image's own user instead.
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
  groupRef:
    name: mcp-tools