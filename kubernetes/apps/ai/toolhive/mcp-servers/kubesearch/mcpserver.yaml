---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
  namespace: ai
spec:
  image: ghcr.io/rust84/kubesearch-mcp-server:latest@sha256:70700bdd9d5833a887f1738fe5a2dd1fdc519d08a3bf807c2ed8d00d0d61ce75
  # MCP server speaks stdio natively; Toolhive proxies to streamable-http.
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  # Joins the mcp-tools MCPGroup; VirtualMCPServer/mcp-gateway auto-aggregates.
  groupRef:
    name: mcp-tools
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # SQLite needs to write WAL/journal files alongside the DBs in /data.
  # The toolhive-operator enforces readOnlyRootFilesystem: true by default;
  # override it for this MCP since the bundled SQLite DBs need a writable
  # parent directory.
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            readOnlyRootFilesystem: false
