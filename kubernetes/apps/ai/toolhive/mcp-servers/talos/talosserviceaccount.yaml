---
# Requires the Talos ServiceAccount extension (talos.dev CRDs) installed in the
# cluster; the controller generates the talos-mcp-talosconfig Secret below.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/talos.dev/serviceaccount_v1alpha1.json
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-mcp-talosconfig
  namespace: ai
spec:
  roles:
    - os:reader
