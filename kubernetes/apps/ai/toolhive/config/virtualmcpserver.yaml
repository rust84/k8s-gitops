---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
  namespace: ai
spec:
  groupRef:
    name: mcp-tools
  # NOTE: the optimizer (embedding-based tool routing) is intentionally not
  # enabled -- it needs an embedding service + API key. Add a config.optimizer
  # block (and the matching OPENAI_API_KEY env) once litellm exposes an embed
  # model you want to route against.
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
