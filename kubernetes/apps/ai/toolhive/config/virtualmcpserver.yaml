---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
  namespace: ai
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    # Optimizer: replace the full backend tool list with find_tool/call_tool and
    # route via hybrid semantic+keyword search. embeddingServerRef only accepts
    # ToolHive-managed TEI servers, so we point at the LLMKube qwen3-embedding
    # InferenceService directly via an explicit OpenAI-compatible URL.
    optimizer:
      embeddingProvider: openai
      embeddingService: http://qwen3-embedding-0-6b.ai.svc.cluster.local:8080/v1
      embeddingModel: qwen3-embedding
      # Cold iGPU llama.cpp faults compute buffers under load; allow headroom.
      embeddingServiceTimeout: 180s
      maxToolsToReturn: 8
      hybridSearchSemanticRatio: "0.5"
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  # Durable session storage on the cluster-local Dragonfly (Redis-compatible),
  # needed because the optimizer pins clients to the stateful session path so
  # sessions survive vmcp restarts/rollouts. Dragonfly is keyless here, so no
  # passwordRef. Dedicated db 9 to avoid shared db 0 and open-webui(7)/searxng(8).
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    db: 9
    keyPrefix: "toolhive:vmcp:"
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            # LLMKube's embedding endpoint is keyless; the OpenAI embedding client
            # the optimizer uses requires a non-empty key to initialize, so give it
            # a throwaway value. Not a secret -- LLMKube ignores the bearer token.
            - name: OPENAI_API_KEY
              value: llmkube-local
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
