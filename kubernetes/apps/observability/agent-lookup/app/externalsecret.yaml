# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-observability-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agent-observability-token
    creationPolicy: Owner
    template:
      # Envoy Gateway apiKeyAuth expects the client id as the Secret key and
      # the shared token as its value.
      data:
        openclaw: '{{ .TOKEN }}'
  dataFrom:
    - extract:
        key: agent-observability-token
