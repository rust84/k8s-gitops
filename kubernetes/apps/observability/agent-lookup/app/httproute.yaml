---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-lookup
spec:
  hostnames:
    - "agent-lookup.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    # Alertmanager API v2 (alerts, silences, status).
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: alertmanager
          port: 9093
    # Prometheus query API only (query + query_range).
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/query
      backendRefs:
        - name: prometheus-prometheus
          port: 9090
