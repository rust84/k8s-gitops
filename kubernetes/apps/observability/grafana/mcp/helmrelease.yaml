---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcp-grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        # mcp-grafana image runs as root (static binary, writes nothing)
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    controllers:
      mcp-grafana:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 2.2.0
            args:
              - "-t"
              - "sse"
              - "--address"
              - "0.0.0.0:8000"
              # Host-header allowlist: the VirtualMCPServer connects via the
              # cluster DNS name from the MCPServerEntry remoteUrl.
              - "--allowed-hosts"
              - "mcp-grafana.observability:8000,mcp-grafana.observability.svc.cluster.local:8000"
              - "--allowed-origins"
              - "*"
              # Separate listener skips Host/Origin validation, so kubelet
              # probes (Host = pod IP) pass on /healthz.
              - "--healthz-address"
              - ":8080"
            env:
              GRAFANA_URL: "http://grafana.observability.svc.cluster.local:80"
            envFrom:
              - secretRef:
                  name: mcp-grafana
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz
                port: 8080
              readiness:
                enabled: true
                type: HTTP
                path: /healthz
                port: 8080
              startup:
                enabled: true
                type: HTTP
                path: /healthz
                port: 8080
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8000
