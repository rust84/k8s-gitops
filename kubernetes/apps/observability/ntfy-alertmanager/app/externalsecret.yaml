---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app ntfy-alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ntfy-alertmanager-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # ntfy access token for the "agent" user (write-only on the
        # homelab-alerts topic). Rendered as an scfg fragment that the
        # ConfigMap config includes.
        ntfy.scfg: |
          ntfy {
              access-token "{{ .NTFY_ACCESS_TOKEN }}"
          }
  dataFrom:
    - extract:
        key: ntfy-alertmanager
