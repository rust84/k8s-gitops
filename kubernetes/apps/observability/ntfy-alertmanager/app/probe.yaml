# TEMPORARY probe 1: does 1Password item "ntfy" exist? A bogus property on an
# existing item fails with a field error; a missing item fails with the title.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: probe-item-01-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: probe-item-01-ntfy
    creationPolicy: Owner
  data:
    - secretKey: probe
      remoteRef:
        key: ntfy
        property: __no_such_field__
---
