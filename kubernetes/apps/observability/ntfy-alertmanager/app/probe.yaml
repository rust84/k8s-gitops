# TEMPORARY probe: determines whether 1Password item "ntfy" exists and which field
# holds the ntfy credential. Delete this file once the real ExternalSecret is wired.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: probe-exists-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: probe-exists-ntfy
    creationPolicy: Owner
  data:
    - secretKey: probe
      remoteRef:
        key: ntfy
        property: __probe__
