---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./probe.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: ntfy-alertmanager-config
    files:
      - ./config/config.scfg
generatorOptions:
  disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
