---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 10.20.0.149 # Control plane VIP
  - 127.0.0.1   # KubePrism
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
---
# Remove default admission controllers (PodSecurity)
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
---
# Keep --anonymous-auth=false (the generated default allows anonymous /livez, /readyz, /healthz)
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
$patch: delete
