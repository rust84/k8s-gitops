---
version: "3"

vars:
  PROJECT_DIR:
    sh: "git rev-parse --show-toplevel"
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  TALOS_DIR: "{{.ROOT_DIR}}/kubernetes/bootstrap/talos"
  TALOSCONFIG_FILE: "{{.ROOT_DIR}}/kubernetes/bootstrap/talos/talosconfig"

env:
  TALOSCONFIG: "{{.TALOSCONFIG_FILE}}"
  TOPFCONFIG: "{{.ROOT_DIR}}/kubernetes/bootstrap/talos/topf.yaml"

includes:
  bootstrap: .taskfiles/bootstrap
  flux: .taskfiles/flux
  k8s: .taskfiles/k8s
  talos: .taskfiles/talos
  volsync: .taskfiles/volsync

tasks:
  default:
    silent: true
    cmds:
      - task -l
