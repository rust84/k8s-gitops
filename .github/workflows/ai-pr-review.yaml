---
name: AI PR Review
on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  review-pr:
    name: AI PR Review
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RUST84_APP_ID }}
          private-key: ${{ secrets.RUST84_APP_PRIVATE_KEY }}

      - name: Analyze PR with reusable AI reviewer
        id: analyze
        uses: misospace/pr-reviewer-action@768a1320d67f14b99737633a5f8ba58449c3caeb # v3.4.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          ai-primary-retries: "3"
          ai-primary-retry-delay-sec: "15"
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: openai
          ai-model: qwen3.8-flash-next
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          ai-max-tokens: "16000"
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: anthropic
          ai-fallback-model: MiniMax-M2.7
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: anthropic
          ai-smart-model: MiniMax-M3
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: "github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,talos.dev,www.talos.dev,docs.siderolabs.com"
          context-limit-mode: normal
          ci-status-check: "true"
          ci-timeout-sec: "600"
          search-url: "https://search.roswellian.dev/search"
          tool-mode: native_loop
          tool-max-rounds: "2"
          tool-max-requests: "4"
          tool-loop-wall-clock-sec: "600"
          tool-turn-timeout-sec: "300"
          tool-corpus-max-bytes: "15000"
          tool-max-tokens-per-turn: "16000"
          tool-max-response-bytes: "12000"
          tool-allowed-gh-api-repos: "*"
          tool-request-timeout-sec: "15"
          tool-enable-for-forks: "false"
          tool-mcp-servers: "konflate=${{ vars.KONFLATE_URL }}"
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          standards-file-candidates: "AGENTS.md"
          evidence-providers-file: .github/konflate-evidence-providers.json
          on-model-failure: notice
          inline-findings: "true"
          publish-mode: review_comment
