---
name: AI PR Review
on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  review-pr:
    name: AI PR Review
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Only numeric PR IDs reach the API; no PR-authored text reaches the shell.
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha // empty')"
          [[ "$head_sha" =~ ^[[:xdigit:]]{40}$ ]] || { echo "::error::Invalid PR head SHA"; exit 1; }
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RUST84_APP_ID }}
          private-key: ${{ secrets.RUST84_APP_PRIVATE_KEY }}

      - name: Analyze PR with reusable AI reviewer
        id: analyze
        uses: misospace/pr-reviewer-action@3d354d4ccf6ccdeaf1ad7a9547775426f25a0216 # v3.10.0
        env:
          # Pin the stale-review gate to the resolved head SHA.
          PR_REVIEWER_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          # Per-run session id for LiteLLM request correlation.
          ai-extra-headers: |
            x-litellm-session-id: prreview-${{ github.run_id }}-${{ github.run_attempt }}
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: openai
          ai-model: qwen3.8-flash-next
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          # qwen3.8-flash-next rejects response_format
          ai-response-format: off
          # Cap well below the engine window (261,888 total, see litellm
          # configmap) so worst-case prompt prefill finishes inside the
          # Cloudflare ~100s origin timeout on litellm.roswellian.dev: the
          # local engine prefills at ~1200 tok/s, so anything >= ~120k
          # tokens returns HTTP 524 before the first response byte.
          # 92160 = 90 * 1024 -> ~75s worst-case prefill + margin. Keeps
          # corpus/diff budgets deterministic.
          primary-model-context-tokens: "92160"
          # Z.AI coding endpoint (1M window, 5h rolling quota); conservative
          # floor keeps fallback-run corpus budgets sane.
          fallback-model-context-tokens: "131072"
          ai-max-tokens: "16000"
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: openai
          ai-fallback-model: glm-5.3-flash
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          review-verbosity: concise
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: openai
          ai-smart-model: glm-5.3-flash
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: "github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,talos.dev,www.talos.dev,docs.siderolabs.com"
          context-limit-mode: normal
          ci-status-check: "true"
          ci-timeout-sec: "600"
          claim-falsification: "true"
          deep-review: auto
          search-url: "https://search.roswellian.dev/search"
          tool-allowed-gh-api-repos: "*"
          tool-mcp-servers: "konflate=${{ vars.KONFLATE_URL }}"
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          standards-file-candidates: "AGENTS.md"
          evidence-providers-file: .github/konflate-evidence-providers.json
          on-model-failure: notice
          inline-findings: "true"
          publish-mode: comment
          repository-skills: "true"
          upstream-link-mode: togithub